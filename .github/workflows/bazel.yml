name: Bazel kernel

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Kernel unit checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/bazel -p '*_test.py'
      - run: python3 -m compileall -q tools/bazel

  source-and-cache:
    name: ${{ matrix.name }} VS kernel source and remote cache
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            host: amd64
            id: amd64
            name: AMD64
            machine: x86_64
            runner: ubuntu-22.04
            cache_sha256: 6a6b64666c2238ec6b49b7b29f5e41e4149de09417a0028897c9bffe40376876
          - architecture: arm64
            host: arm64
            id: arm64
            name: ARM64
            machine: aarch64
            runner: ubuntu-22.04-arm
            cache_sha256: 295e54fd58841211b00fb204cafc13affc6a13d8946a4520c0ecdce22626ef93
          - architecture: arm64
            host: amd64
            id: amd64-to-arm64
            name: AMD64 to ARM64
            machine: x86_64
            runner: ubuntu-22.04
            cache_sha256: 6a6b64666c2238ec6b49b7b29f5e41e4149de09417a0028897c9bffe40376876
          - architecture: armhf
            host: amd64
            id: amd64-to-armhf
            name: AMD64 to ARMHF
            machine: x86_64
            runner: ubuntu-22.04
            cache_sha256: 6a6b64666c2238ec6b49b7b29f5e41e4149de09417a0028897c9bffe40376876
    timeout-minutes: 300
    env:
      REGISTRY_REVISION: 01b7128186ec5fdb669477dc51fe4c1dc12dd4b5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify unprivileged host execution and Linux namespaces
        run: |
          test "$(id -u)" -ne 0
          test "$(uname -s)" = Linux
          test "$(uname -m)" = '${{ matrix.machine }}'
          test "$(dpkg --print-architecture)" = '${{ matrix.host }}'
          command -v xz
          unshare --user --map-current-user --mount --pid --fork true
          echo 'Native ${{ matrix.host }} host verified for ${{ matrix.architecture }} target build.'
      - name: Prepare independent consumers using the reviewed registry snapshot
        run: |
          python3 - <<'PY_REGISTRY'
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          os.umask(0o077)
          root = Path(os.environ["RUNNER_TEMP"]) / "kernel-private"
          root.mkdir(mode=0o700)
          template = Path("tools/bazel/cache-consumer")
          prefix = "common --registry=https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/"
          original = (template / ".bazelrc").read_text()
          if [line for line in original.splitlines() if line.startswith(prefix)] != [prefix + "main"]:
              raise SystemExit("Expected one SONiC registry entry selecting main")
          revision = os.environ["REGISTRY_REVISION"]
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("Expected a full reviewed registry revision")
          selected = original.replace(prefix + "main", prefix + revision)
          (root / "effective.bazelrc").write_text(selected)
          (root / "registry-inputs.json").write_text(json.dumps({
              "declared_registry": prefix.removeprefix("common --registry=") + "main",
              "registry": prefix.removeprefix("common --registry=") + revision,
              "observed_revision": revision, "draft_validation": True,
          }, indent=2) + "\n")
          for run in ("cold", "hit"):
              consumer = root / (run + "-consumer")
              consumer.mkdir()
              for name in ("BUILD.bazel", "MODULE.bazel"):
                  source = template / name
                  if not source.is_file() or source.is_symlink():
                      raise SystemExit("Expected regular consumer template files")
                  shutil.copyfile(source, consumer / name)
              (consumer / ".bazelrc").write_text(selected)
          PY_REGISTRY
      - name: Retain registry selection evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-${{ matrix.id }}-registry-inputs
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/kernel-private/effective.bazelrc
            ${{ runner.temp }}/kernel-private/registry-inputs.json

      - name: Prepare runner disk space before the unprivileged build
        run: |
          # Runner provisioning only; no build command uses sudo.
          # These preinstalled SDKs are unused: all kernel tools are declared Bazel inputs.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          python3 - <<'PY'
          import os, shutil
          free = shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          print(f'Free build disk: {free / 2**30:.1f} GiB')
          if free < 45 * 2**30:
              raise SystemExit('Kernel source/cache validation requires 45 GiB free scratch space')
          PY
      - name: Start an empty remote action cache as the runner user
        run: |
          umask 077
          cache_binary="$RUNNER_TEMP/kernel-private/bazel-remote"
          curl --fail --location --retry 3 --output "$cache_binary" \
            'https://github.com/buchgr/bazel-remote/releases/download/v2.6.4/bazel-remote-2.6.4-linux-${{ matrix.host }}'
          printf '%s  %s\n' '${{ matrix.cache_sha256 }}' "$cache_binary" | sha256sum --check --status
          chmod 700 "$cache_binary"
          env -i RUNNER_TRACKING_ID="${RUNNER_TRACKING_ID:-}" "$cache_binary" \
            --dir="$RUNNER_TEMP/kernel-private/cache" --max_size=8 \
            --http_address=127.0.0.1:8080 --grpc_address=none \
            > "$RUNNER_TEMP/kernel-private/cache.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/kernel-private/cache.pid"
      - name: Compile the kernel from declared sources
        run: |
          umask 077
          set -o pipefail
          if curl --fail --show-error --silent --retry 15 --retry-delay 1 \
            --retry-connrefused --retry-all-errors --retry-max-time 30 --max-time 2 \
            http://127.0.0.1:8080/status > "$RUNNER_TEMP/kernel-private/cache-before-cold.json" \
            2> "$RUNNER_TEMP/kernel-private/cold-cache-probe.log"; then
            echo "The empty action cache is ready."
          else
            status=$?
            echo "Cache status probe failed with exit code $status."
            exit "$status"
          fi
          if python3 tools/bazel/build.py \
            --architecture '${{ matrix.architecture }}' \
            --workspace "$RUNNER_TEMP/kernel-private/cold-consumer" \
            --work-dir "$RUNNER_TEMP/kernel-private/cold" \
            --repository-cache "$RUNNER_TEMP/kernel-private/downloads" \
            --module-override "sonic-linux-kernel=$GITHUB_WORKSPACE" \
            --target @sonic_linux_kernel//:kernel_packages \
            --remote-cache http://127.0.0.1:8080 \
            2>&1 | tee "$RUNNER_TEMP/kernel-private/cold-launcher.log"; then
            echo "Kernel source command completed."
          else
            status=$?
            echo "Kernel source command failed with exit code $status."
            exit "$status"
          fi
      - name: Fetch from the remote cache in a fresh Bazel output directory
        timeout-minutes: 10
        run: |
          umask 077
          set -o pipefail
          if curl --fail --show-error --silent --retry 15 --retry-delay 1 \
            --retry-connrefused --retry-all-errors --retry-max-time 30 --max-time 2 \
            http://127.0.0.1:8080/status > "$RUNNER_TEMP/kernel-private/cache-before-hit.json" \
            2> "$RUNNER_TEMP/kernel-private/hit-cache-probe.log"; then
            echo "The action cache is ready for the fresh consumer."
          else
            status=$?
            echo "Cache status probe failed with exit code $status."
            exit "$status"
          fi
          if python3 tools/bazel/build.py \
            --architecture '${{ matrix.architecture }}' \
            --workspace "$RUNNER_TEMP/kernel-private/hit-consumer" \
            --work-dir "$RUNNER_TEMP/kernel-private/hit" \
            --repository-cache "$RUNNER_TEMP/kernel-private/downloads" \
            --module-override "sonic-linux-kernel=$GITHUB_WORKSPACE" \
            --target @sonic_linux_kernel//:kernel_packages \
            --remote-cache http://127.0.0.1:8080 --remote-cache-read-only \
            2>&1 | tee "$RUNNER_TEMP/kernel-private/hit-launcher.log"; then
            echo "Kernel cache consumer command completed."
          else
            status=$?
            echo "Kernel cache consumer command failed with exit code $status."
            exit "$status"
          fi
      - name: Verify compilation was skipped and Debian packages are identical
        run: |
          umask 077
          set -o pipefail
          if python3 tools/bazel/verify_cache.py \
            --architecture '${{ matrix.architecture }}' --host-architecture '${{ matrix.host }}' \
            --cold "$RUNNER_TEMP/kernel-private/cold" --hit "$RUNNER_TEMP/kernel-private/hit" \
            --artifacts "$RUNNER_TEMP/kernel-private/verified" \
            2>&1 | tee "$RUNNER_TEMP/kernel-private/verify.log"; then
            echo "Kernel source and cache verification passed."
          else
            status=$?
            echo "Kernel source and cache verification failed with exit code $status."
            exit "$status"
          fi
      - name: Verify fresh resolution evidence and unchanged source inputs
        run: |
          git diff --exit-code
          for run in cold hit; do
            test -s "$RUNNER_TEMP/kernel-private/$run-consumer/MODULE.bazel.lock"
            test "$(cat "$RUNNER_TEMP/kernel-private/$run/module-graph.exit-code")" = 0
          done
      - name: Collect verified Debian packages and a validation summary
        id: collect
        if: always()
        env:
          KERNEL_JOB_STATUS: ${{ job.status }}
        run: |
          python3 tools/bazel/collect_ci_artifacts.py \
            --architecture '${{ matrix.architecture }}' --host-architecture '${{ matrix.host }}' \
            --private-root "$RUNNER_TEMP/kernel-private" --source-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/kernel-artifacts" --job-status "$KERNEL_JOB_STATUS" --phase source
      - name: Upload Debian packages and validation summary
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-${{ matrix.id }}-vs-cache-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/kernel-artifacts/*.deb
            ${{ runner.temp }}/kernel-artifacts/validation.json
      - name: Stop this job's cache
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/kernel-private/cache.pid"; then
            cache_pid=$(cat "$RUNNER_TEMP/kernel-private/cache.pid")
            if test "$(readlink "/proc/$cache_pid/exe")" = "$RUNNER_TEMP/kernel-private/bazel-remote"; then
              kill "$cache_pid"
            fi
          fi

  installation:
    name: ${{ matrix.name }} kernel package installation
    needs: source-and-cache
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            host: amd64
            id: amd64
            name: AMD64
            platform: linux/amd64
            emulated: false
            runner: ubuntu-24.04
          - architecture: arm64
            host: arm64
            id: arm64
            name: ARM64
            platform: linux/arm64
            emulated: false
            runner: ubuntu-24.04-arm
          - architecture: arm64
            host: amd64
            id: amd64-to-arm64
            name: AMD64 to ARM64
            platform: linux/arm64
            emulated: false
            runner: ubuntu-24.04-arm
          - architecture: armhf
            host: amd64
            id: amd64-to-armhf
            name: AMD64 to ARMHF (QEMU installation)
            platform: linux/arm/v7
            emulated: true
            runner: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare private installation evidence
        run: install -d -m 700 "$RUNNER_TEMP/kernel-private/verified"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-${{ matrix.id }}-vs-cache-evidence
          path: ${{ runner.temp }}/kernel-private/verified
      - name: Verify the downloaded packages belong to this source build
        env:
          KERNEL_ARCHITECTURE: ${{ matrix.architecture }}
          KERNEL_HOST_ARCHITECTURE: ${{ matrix.host }}
        run: |
          python3 - <<'PY_VERIFY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/bazel')
          from collect_ci_artifacts import file_at, output_digests, package_names, require, sha256, unique_object
          root = Path(os.environ['RUNNER_TEMP']) / 'kernel-private'
          architecture = os.environ['KERNEL_ARCHITECTURE']
          summary = json.loads(file_at(root, 'verified/validation.json').read_text(), object_pairs_hook=unique_object)
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          require(summary.get('result') == 'passed' and summary.get('phase') == 'source'
                  and summary.get('architecture') == architecture
                  and summary.get('host_architecture') == os.environ['KERNEL_HOST_ARCHITECTURE']
                  and summary.get('checkout_revision') == revision,
                  'source validation does not match this checkout')
          hashes = output_digests(summary.get('outputs_sha256'), architecture)
          for name in package_names(architecture):
              require(sha256(file_at(root, 'verified/' + name)) == hashes[name], 'downloaded package digest differs')
          PY_VERIFY
      # Installing packages and executing their hooks needs a disposable system.
      # This job consumes the DEBs; kernel compilation and cache verification
      # already ran unprivileged in Bazel linux-sandbox on the declared host.
      # Only ARMHF installation uses emulation; cross compilation does not.
      - name: Enable ARM emulation for installation checks only
        if: matrix.emulated
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Install packages and verify hooks, headers and debugger lookup
        run: |
          umask 077
          set -o pipefail
          docker run --rm --platform=${{ matrix.platform }} \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/kernel-private,dst=/evidence" \
            debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c \
            /bin/sh -ec '
              test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gdb python3 binutils xz-utils zstd build-essential kmod initramfs-tools
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends /evidence/verified/*.deb
              python3 /source/tools/bazel/verify_install.py --architecture ${{ matrix.architecture }} --output /evidence/installation.json
              python3 /source/tools/bazel/verify_debug.py --architecture ${{ matrix.architecture }} --root / --output /evidence/debugger.json
            ' 2>&1 | tee "$RUNNER_TEMP/kernel-private/debugger.log"
          echo "Installed package metadata, initramfs, external-module build and debugger lookup passed."
      - name: Collect the installation validation summary
        id: collect
        if: always()
        env:
          KERNEL_JOB_STATUS: ${{ job.status }}
        run: |
          python3 tools/bazel/collect_ci_artifacts.py \
            --architecture '${{ matrix.architecture }}' --host-architecture '${{ matrix.host }}' \
            --private-root "$RUNNER_TEMP/kernel-private" --source-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/kernel-installation" --job-status "$KERNEL_JOB_STATUS" --phase installation
      - name: Upload installation validation
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-${{ matrix.id }}-vs-installation-evidence
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/kernel-installation/validation.json

  required-checks:
    # Keep the established branch-protection name while requiring every pair
    # declared by this workflow. Older PR workflows retain their own checks.
    name: Kernel input checks
    needs: [unit, source-and-cache, installation]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require unit, source/cache and package installation checks
        run: |
          test '${{ needs.unit.result }}' = success
          test '${{ needs.source-and-cache.result }}' = success
          test '${{ needs.installation.result }}' = success
